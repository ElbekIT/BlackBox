<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fon gradienti -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <!-- Neon kiber-yashil gradient -->
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00B84D" />
    </linearGradient>

    <!-- Neon ko'k aksent -->
    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <!-- Neon nur effekti (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Play Market Adaptive Icon foni -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Tashqi kiber-ramka -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#1A2332" stroke-width="4" />

  <!-- Izometrik Qora Quti (3D kub) -->
  <g filter="url(#neonGlow)">
    <!-- Kubning yuqori qismi -->
    <polygon points="256,105 390,182 256,258 122,182" fill="#121820" stroke="url(#cyberGreen)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Kubning chap tomoni -->
    <polygon points="122,182 256,258 256,412 122,335" fill="#0A0E14" stroke="url(#cyberGreen)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Kubning o'ng tomoni -->
    <polygon points="256,258 390,182 390,335 256,412" fill="#05070A" stroke="url(#cyberCyan)" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Yuqori qismdagi kiber-chiziqlar (mikrosxema izi) -->
  <path d="M 195 182 L 256 148 L 317 182" fill="none" stroke="#00FF66" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <circle cx="256" cy="182" r="6" fill="#00E5FF" />

  <!-- O'ng tarafdagi himoya qulfi / kalit teshigi (Keyhole) -->
  <circle cx="323" cy="285" r="14" fill="#00E5FF" />
  <polygon points="316,294 330,294 335,330 311,330" fill="#00E5FF" />

  <!-- Chap tarafdagi shifrlash indikatorlari -->
  <line x1="155" y1="245" x2="215" y2="279" stroke="#00FF66" stroke-width="6" stroke-linecap="round" />
  <line x1="155" y1="275" x2="195" y2="298" stroke="#00FF66" stroke-width="6" stroke-linecap="round" opacity="0.6" />
</svg>